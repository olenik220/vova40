<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/static/fontawesome/all.min.css">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Vova40 — {{ wh_name }}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;padding-bottom:90px}
.header{background:white;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.header a{text-decoration:none;font-size:22px;color:#333}
.header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px;flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.header h1 .logo{display:block;width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0}
.content{max-width:560px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:white;border-radius:14px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04);text-decoration:none;color:inherit;transition:transform .1s;display:block}
.cat:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.cat .icon{font-size:36px;margin-bottom:4px}
.cat .name{font-size:13px;font-weight:700;margin-bottom:2px}
.cat .count{font-size:11px;color:#999}
.empty{text-align:center;padding:60px 20px;color:#aaa}
.empty i{font-size:48px;display:block;margin-bottom:12px}
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:#4A90D9;color:white;font-size:28px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 4px 12px rgba(74,144,217,.4)}
.header h1 .wh-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.stats-link{margin-left:auto;color:#4A90D9;font-size:20px;text-decoration:none;padding:6px;flex-shrink:0}
</style>
</head>
<body>
<div class="header"><a href="{{ url_for('warehouse_choice') }}">←</a><h1><img class="logo" src="/static/logo.jpg" alt="40"><span class="wh-name">{{ wh_name }}</span></h1>{% if is_admin %}<a class="stats-link" href="{{ url_for('stats', wh_id=wh_id) }}"><i class="fa-solid fa-chart-simple"></i></a>{% endif %}</div>
<div class="content">
{% if cats %}
<div class="grid">
{% for c in cats %}
<a class="cat" href="{{ url_for('warehouse_items', wh_id=wh_id, category=c.name) }}">
<div class="icon">{{ c.icon }}</div>
<div class="name">{{ c.name }}</div>
<div class="count">{{ c.count }} {{ 'товар' if c.count == 1 else ('товара' if c.count < 5 else 'товаров') }}</div>
</a>
{% endfor %}
</div>
{% else %}
<div class="empty">
<i class="fa-solid fa-box-open"></i>
<p>На складе пока нет товаров</p>
</div>
{% endif %}
</div>
<a class="fab" href="{{ url_for('choose_category', wh_id=wh_id) }}">+</a>
</body>
</html>
