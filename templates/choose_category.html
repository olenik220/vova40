<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Vova40 — {{ wh_name }}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333}
.header{background:white;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.header a{text-decoration:none;font-size:22px;color:#333}
.header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.header h1 .logo{display:block;width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0}
.header .crumb{font-size:12px;color:#999;font-weight:400}
.content{max-width:560px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:white;border-radius:14px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04);text-decoration:none;color:inherit;transition:transform .1s}
.cat:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.cat .icon{font-size:36px;margin-bottom:4px}
.cat .name{font-size:13px;font-weight:700;margin-bottom:2px}
.cat .sub-count{font-size:11px;color:#999;margin-bottom:6px}
</style>
</head>
<body>
<div class="header"><a href="{{ url_for('warehouse_categories', wh_id=wh_id) }}">←</a><h1><img class="logo" src="/static/logo.jpg" alt="40"> {{ wh_name }}</h1></div>
<div class="content"><div class="grid">
{% for cat_key, cat_val in avito_cats.items() %}
<a class="cat" href="{{ url_for('choose_category', wh_id=wh_id, category=cat_key) }}">
<div class="icon">{{ cat_val.icon }}</div>
<div class="name">{{ cat_key }}</div>
<div class="sub-count">{{ cat_val.subcategories|length }} подкатегорий</div>
</a>
{% endfor %}
</div></div>
</body>
</html>
