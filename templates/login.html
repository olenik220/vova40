<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vova40 — Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
               background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 16px; padding: 40px 24px; width: 90%; max-width: 360px;
                      box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center; }
        .login-card h1 { font-size: 22px; margin-bottom: 16px; }
        .login-card p { color: #666; margin-bottom: 20px; font-size: 14px; }
        .logo-badge { display: inline-flex; align-items: center; justify-content: center;
                     background: linear-gradient(135deg, #4A90D9, #357ABD);
                     color: white; border-radius: 12px; padding: 8px 18px;
                     font-size: 36px; font-weight: 800; letter-spacing: 2px; margin-bottom: 8px; }
        .brand-name { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
        input[type="password"] { width: 100%; padding: 12px 16px; font-size: 16px; border: 2px solid #ddd;
                                border-radius: 10px; outline: none; }
        input[type="password"]:focus { border-color: #4A90D9; }
        button { width: 100%; padding: 12px; font-size: 16px; font-weight: 600; border: none; border-radius: 10px;
                 background: #4A90D9; color: white; cursor: pointer; margin-top: 16px; }
        button:hover { background: #357ABD; }
        .flash { padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
        .flash.danger { background: #ffe0e0; color: #d00; }
    </style>
<link rel="stylesheet" href="/static/fontawesome/all.min.css">
</head>
<body>
    <div class="login-card">
        <div class="logo-badge">40</div>
        <div class="brand-name">Vova40</div>
        <p>Введите пароль для доступа</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                    <div class="flash {{ cat }}">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="username" placeholder="Имя (пусто — администратор)" autocomplete="username" style="width:100%;padding:12px 16px;font-size:16px;border:2px solid #ddd;border-radius:10px;outline:none;margin-bottom:12px;">
            <input type="password" name="password" placeholder="Пароль" autofocus required style="width:100%;padding:12px 16px;font-size:16px;border:2px solid #ddd;border-radius:10px;outline:none;">
            <button type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> Войти</button>
        </form>
        <div style="margin-top:16px;font-size:12px;color:#aaa;line-height:1.5;">
            Администратор: имя пустое или «admin» + пароль.<br>
            Сотрудник Max: имя «Max», пароль max13.
        </div>
    </div>
</body>
</html>
