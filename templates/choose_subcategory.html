<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="/static/fontawesome/all.min.css">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Vova40 — {{ category }}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333}
.header{background:white;padding:16px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.header a{text-decoration:none;font-size:22px;color:#333}
.header h1{font-size:16px;font-weight:700}
.header .crumb{font-size:12px;color:#999;font-weight:400}
.content{max-width:560px;margin:0 auto;padding:16px}
.cat-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sub{background:white;border-radius:14px;padding:20px 12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04);text-decoration:none;color:inherit;font-size:14px;font-weight:600;transition:transform .1s;display:flex;flex-direction:column;align-items:center;gap:4px}
.sub:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.sub .name{font-size:15px;font-weight:700;margin-bottom:2px}
</style>
</head>
<body>
<div class="header"><a href="{{ url_for('choose_category', wh_id=wh_id) }}">←</a><h1><span class="crumb">{{ wh_name }}</span><br>{{ category }}</h1></div>
<div class="content">
<div class="grid">
{% for sub in subcategories %}
<a class="sub" href="{{ url_for('choose_category', wh_id=wh_id, category=category, subcategory=sub) }}">
<div class="name">{{ sub }}</div>
</a>
{% endfor %}
</div>
</div>
</body>
</html>
